<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jaecoo 7">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Jaecoo 7</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --sep:rgba(60,60,67,.18);
  --ink:#000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.32);
  --maint:#1BAF7A; --fees:#E87BA4;
  --blue:#007AFF; --el:#007AFF; --fuel:#FF9500; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --bar:rgba(249,249,249,.86); --fill:rgba(118,118,128,.12); --seg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.6);
    --ink:#fff; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
    --maint:#199E70; --fees:#D55181;
    --blue:#0A84FF; --el:#0A84FF; --fuel:#D47800; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --bar:rgba(22,22,24,.86); --fill:rgba(118,118,128,.24); --seg:#636366;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Come un'app nativa: niente selezione del testo, niente menu "copia/salva immagine" con la pressione prolungata.
   I campi di inserimento restano selezionabili per poter correggere i valori. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* Pagine */
main{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
.page{display:none}.page.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.nav{display:flex;justify-content:flex-end;gap:18px;height:44px;align-items:center}
.nav button{color:var(--blue);display:flex;align-items:center}
.nav svg{width:26px;height:26px}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 14px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--ink2);margin:26px 16px 7px;letter-spacing:.1px;display:flex;justify-content:space-between;gap:8px}
h2 span{text-transform:none}

/* Liste raggruppate stile iOS */
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink2);margin-top:2px}
.row .v{text-align:right;white-space:nowrap}
.row .v .s{text-align:right}
.chev{color:var(--ink3);font-size:20px;margin-left:-4px}
.empty{color:var(--ink2);text-align:center;padding:28px 16px;font-size:15px}
.note{font-size:13px;color:var(--ink2);margin:7px 16px 0;line-height:1.4}

/* Card statistiche */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px}
.tile .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .n{font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
.tile .n small{font-size:15px;font-weight:500;color:var(--ink2);margin-left:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Scheda auto */
.hero{border-radius:16px;overflow:hidden;position:relative;padding:4px 16px 14px;
  background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#E9EBEF 55%,#DADDE2 100%)}
@media (prefers-color-scheme: dark){.hero{background:radial-gradient(120% 90% at 50% 0%,#3A3A3E 0%,#232326 55%,#1C1C1E 100%)}}
.hero svg.car{display:block;width:100%;height:auto;margin:6px 0 2px}
.hero.anim svg.car{animation:drive .9s cubic-bezier(.2,.9,.25,1)}
@keyframes drive{from{transform:translateX(-14%);opacity:0}to{transform:none;opacity:1}}
.hero .sub{font-size:15px;color:var(--ink2);text-align:center}
.hero.has-photo{padding-top:0}
.hero img.photo{display:block;width:calc(100% + 32px);height:auto;max-height:260px;margin:0 -16px 12px;object-fit:contain}
.hero.anim img.photo{animation:fade .6s ease}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.quick button{background:var(--card);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--blue)}
.quick button:active{opacity:.6}
.quick svg{width:22px;height:22px}
.tile.wide{grid-column:1/-1}
.tile .s{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.35}
.tile.save .n{color:var(--green)}
.combo{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 6px;background:var(--fill)}
.combo i{display:block;height:100%}
.tile .s .dot{width:7px;height:7px;vertical-align:1px}
.tile .s b{color:var(--ink);font-weight:600}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--fill);margin:10px 0 4px;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--fuel)}
.gauge b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--card)}
/* Scorri per eliminare */
.sw{position:relative;overflow:hidden}
.sw+.sw .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.sw .row{background:var(--card);transition:transform .25s ease;touch-action:pan-y;position:relative;z-index:1}
.sw.drag .row{transition:none}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--red);color:#fff;font-size:15px;font-weight:500;visibility:hidden}
.sw.drag .del,.sw.open .del{visibility:visible}
.switch{position:relative;width:51px;height:31px;flex:none;-webkit-appearance:none;appearance:none;background:var(--fill);border-radius:16px;transition:background .2s;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.field input.switch{flex:none;width:51px;height:31px;min-height:0;padding:0;text-align:left;border-radius:16px;background:var(--fill)}
.field input.switch:checked{background:var(--green)}
.switch:checked{background:var(--green)}.switch:checked::after{transform:translateX(20px)}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:.5px solid var(--sep);padding-top:12px}
.hero .stats div{text-align:center}
.hero .stats div+div{border-left:.5px solid var(--sep)}
.delta{font-size:12px;font-weight:600;margin-top:3px;color:var(--ink2)}
.delta.good{color:var(--green)}.delta.bad{color:var(--red)}
.delta span{font-weight:400;color:var(--ink2)}
svg.cal rect.d{rx:3.5}
.cal-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--ink2);padding:6px 4px 0}
.cal-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;gap:14px;align-items:center}
.donut-wrap svg{width:44%;flex:none}
.donut-leg{flex:1;min-width:0;font-size:14px}
.donut-leg button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 0;text-align:left}
.donut-leg button{align-items:flex-start}
.donut-leg button .dot{margin-top:6px}
.donut-leg button .nm{flex:1;min-width:0;line-height:1.25}
.donut-leg button .vl{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.donut-leg button.dim{opacity:.4}
.hero .stats b{display:block;font-size:17px;font-weight:600}
.hero .stats span{font-size:12px;color:var(--ink2)}

/* Segmented control */
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 4px}
.segc button{flex:1;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px}
.segc button.on{background:var(--seg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

/* Barra di carica */
.soc{height:6px;border-radius:3px;background:var(--fill);position:relative;margin-top:6px;width:100%}
.soc i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--el)}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink2);margin-left:6px;vertical-align:1px}
.pill.warn{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}

/* Grafico */
.chart{background:var(--card);border-radius:12px;padding:14px 12px 8px}
.chart .head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px;min-height:40px}
.chart .head .big{font-size:22px;font-weight:600}
.chart .head .sub{font-size:13px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);padding:6px 4px 2px}
.legend span{display:flex;align-items:center;gap:6px}
svg.plot{display:block;width:100%;height:auto;overflow:visible}
svg.plot text{fill:var(--ink2);font-size:11px}
svg.plot .grid{stroke:var(--sep);stroke-width:1}
svg.plot .hit{fill:transparent;cursor:pointer}
svg.plot .sel{fill:var(--fill)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:6px 4px calc(env(safe-area-inset-bottom) + 4px);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--ink2);padding:2px 0}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px}

/* Foglio modale */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:14px 14px 0 0;z-index:21;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  padding:0 16px calc(env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;height:56px;position:sticky;top:0;background:var(--bg);z-index:1}
.sheet .bar b{font-size:17px;font-weight:600}
.sheet .bar button{color:var(--blue);min-width:70px;text-align:left}
.sheet .bar button:last-child{text-align:right;font-weight:600}
.sheet .bar button:disabled{color:var(--ink3)}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:none;width:42%}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);text-align:right;padding:12px 0;outline:none;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ink3)}
.field input[type=date]{min-height:24px}
.field .u{color:var(--ink2);flex:none}
.field .segc{flex:1;margin:0}
.preview{margin:10px 16px 0;font-size:15px;color:var(--ink2)}
.preview b{color:var(--ink);font-weight:600}
.danger{color:var(--red);width:100%;text-align:center;justify-content:center}
.btn{color:var(--blue);justify-content:center;text-align:center;width:100%}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:var(--card);
  color:var(--ink);padding:10px 18px;border-radius:20px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:40;transition:transform .3s;font-size:15px}
.toast.on{transform:translate(-50%,0)}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{padding:9px 6px;text-align:right;white-space:nowrap}
table.rep th{color:var(--ink2);font-weight:500}
table.rep th:first-child,table.rep td:first-child{text-align:left;padding-left:16px}
table.rep th:last-child,table.rep td:last-child{padding-right:16px}
table.rep tr+tr td{border-top:.5px solid var(--sep)}
.scrollx{overflow-x:auto}
</style>
</head>
<body>
<main>
  <!-- RIEPILOGO -->
  <section class="page on" id="p-home">
    <div class="nav"><button onclick="openSettings()" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    <h1 id="carName">Jaecoo 7</h1>
    <div id="home"></div>
  </section>

  <!-- RICARICHE -->
  <section class="page" id="p-charge">
    <div class="nav"><button onclick="editCharge()" aria-label="Nuova ricarica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <h1>Ricariche</h1>
    <div class="segc" id="seg-charge"><button class="on" data-v="list">Elenco</button><button data-v="month">Mensile</button></div>
    <div id="charge"></div>
  </section>

  <!-- BENZINA -->
  <section class="page" id="p-fuel">
    <div class="nav"><button onclick="editFuel()" aria-label="Nuovo rifornimento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <h1>Rifornimenti</h1>
    <div class="segc" id="seg-fuel"><button class="on" data-v="list">Elenco</button><button data-v="month">Mensile</button></div>
    <div id="fuel"></div>
  </section>

  <!-- KM -->
  <section class="page" id="p-km">
    <div class="nav"><button onclick="editOdo()" aria-label="Nuova lettura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <h1>Chilometri</h1>
    <div id="km"></div>
  </section>

  <!-- SPESE -->
  <section class="page" id="p-cost">
    <div class="nav"><button onclick="state.costTab==='maint'?editMaint():editFee()" aria-label="Nuova spesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <h1>Spese</h1>
    <div class="segc" id="seg-cost"><button class="on" data-v="maint">Manutenzioni</button><button data-v="fee">Assicurazione e bollo</button></div>
    <div id="cost"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="on" data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/></svg>Riepilogo</button>
  <button data-p="charge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Ricariche</button>
  <button data-p="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>Benzina</button>
  <button data-p="km"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3 4 21M16 3l4 18M12 4v3M12 11v3M12 18v3"/></svg>Km</button>
  <button data-p="cost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Spese</button>
</nav>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>

<script>
'use strict';
/* ================= Dati ================= */
const KEY = 'jaecoo7-data';
const DEFAULT = {
  version: 1,
  settings: { carName: 'Jaecoo 7', carSub: 'SHS-P · 2026 · Moonlight Silver', carColor: '#C3C7CC', capacity: 18.3, loss: 10,
    petrolRef: 6.0, serviceKm: 15000, serviceMonths: 12, regDate: '', tankL: 60, rangeMax: 1117, evCons: 20 },
  tariffs: [], charges: [], fuel: [], odo: [], maint: [], fees: []
};
let db = load();
const state = { page: 'home', chargeView: 'list', fuelView: 'list', costTab: 'maint', range: '6', chartSel: null, kmSel: null, trendSel: null, consLSel: null, consKSel: null, consCSel: null, calSel: null, donutSel: null, year: null };

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.version) return Object.assign(structuredClone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, d.settings) });
  } catch (e) {}
  return structuredClone(DEFAULT);
}
function save() { _odo = null; localStorage.setItem(KEY, JSON.stringify(db)); render(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;

/* ================= Formattazione ================= */
const nf = (d) => new Intl.NumberFormat('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
const F0 = nf(0), F1 = nf(1), F2 = nf(2), F3 = nf(3);
const eur = v => F2.format(v || 0) + ' €';
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const mk = date => date.slice(0, 7);
const mLabel = k => MESI_L[+k.slice(5) - 1] + ' ' + k.slice(0, 4);
const mShort = k => MESI[+k.slice(5) - 1];
const dLabel = s => { const [y, m, d] = s.split('-'); return +d + ' ' + MESI[+m - 1] + ' ' + y; };
const dShort = s => { const [, m, d] = s.split('-'); return +d + ' ' + MESI[+m - 1]; };
const days = s => Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10)) / 864e5;
const fromDays = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addMonths = (k, n) => { let y = +k.slice(0,4), m = +k.slice(5) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ================= Calcoli ================= */
function tariffAt(date) {
  let p = null;
  for (const t of [...db.tariffs].sort((a, b) => a.from < b.from ? -1 : 1)) if (t.from <= date) p = t.price;
  return p;
}
// kWh entrati in batteria: valore inserito oppure capacità × Δ%
const kwhBatt = c => c.kwh != null ? c.kwh : db.settings.capacity * (c.end - c.start) / 100;
// kWh prelevati dalla rete: a casa si aggiunge la dispersione, alla colonnina paghi già quelli erogati
const kwhGrid = c => c.place === 'casa' ? kwhBatt(c) * (1 + db.settings.loss / 100) : kwhBatt(c);
const chargeCost = c => c.place === 'casa' ? kwhGrid(c) * (tariffAt(c.date) ?? 0) : (c.cost || 0);
const liters = f => f.ppl ? f.total / f.ppl : 0;

// Letture km: quelle inserite a mano + i km scritti in ricariche, rifornimenti e manutenzioni
let _odo = null; // cache, azzerata a ogni salvataggio
function odoSorted() {
  if (_odo) return _odo;
  const all = [...db.odo.map(o => ({ ...o, src: 'odo' })),
    ...db.charges.filter(c => c.km).map(c => ({ id: c.id, date: c.date, km: c.km, src: 'charge' })),
    ...db.fuel.filter(f => f.km).map(f => ({ id: f.id, date: f.date, km: f.km, src: 'fuel' })),
    ...db.maint.filter(m => m.km).map(m => ({ id: m.id, date: m.date, km: m.km, src: 'maint' }))];
  return _odo = all.sort((a, b) => byDate(a, b) || a.km - b.km);
}
function kmAt(date) {
  const o = odoSorted();
  if (!o.length || date < o[0].date || date > o[o.length - 1].date) return null;
  for (let i = 0; i < o.length; i++) {
    if (o[i].date === date) { let j = i; while (o[j + 1] && o[j + 1].date === date) j++; return o[j].km; }
    if (o[i].date > date) {
      const a = o[i - 1], b = o[i];
      return a.km + (b.km - a.km) * (days(date) - days(a.date)) / (days(b.date) - days(a.date));
    }
  }
  return null;
}
// Km percorsi in un intervallo [a, b) usando interpolazione lineare tra le letture
function kmBetween(a, b) {
  const o = odoSorted();
  if (o.length < 2) return null;
  const s = a > o[0].date ? a : o[0].date, e = b < o[o.length - 1].date ? b : o[o.length - 1].date;
  if (s >= e) return null;
  return { km: kmAt(e) - kmAt(s), partial: s > a || e < b, s, e };
}
function monthStats(k) {
  const ch = db.charges.filter(c => mk(c.date) === k), fu = db.fuel.filter(f => mk(f.date) === k);
  const home = ch.filter(c => c.place === 'casa'), pub = ch.filter(c => c.place !== 'casa');
  const sum = (arr, fn) => arr.reduce((t, x) => t + fn(x), 0);
  const kmr = kmBetween(k + '-01', addMonths(k, 1) + '-01');
  return {
    k, n: ch.length,
    kwhB: sum(ch, kwhBatt), kwhHome: sum(home, kwhBatt), kwhHomeGrid: sum(home, kwhGrid), kwhPub: sum(pub, kwhBatt),
    elHome: sum(home, chargeCost), elPub: sum(pub, chargeCost), el: sum(ch, chargeCost),
    fuelEur: sum(fu, f => f.total), fuelL: sum(fu, liters), nf: fu.length,
    km: kmr ? kmr.km : null, kmPartial: kmr ? kmr.partial : false,
    maint: sum(db.maint.filter(m => mk(m.date) === k), m => m.cost || 0),
  };
}
function allMonths() {
  const ds = [...db.charges, ...db.fuel, ...db.odo, ...db.maint, ...db.fees].map(x => x.date).filter(Boolean).sort();
  if (!ds.length) return [mk(today())];
  const out = []; let k = mk(ds[0]); const end = mk(today()) > mk(ds[ds.length - 1]) ? mk(today()) : mk(ds[ds.length - 1]);
  while (k <= end) { out.push(k); k = addMonths(k, 1); }
  return out;
}
// Statistiche su una finestra: energia acquistata ≈ energia consumata (approssimazione, migliore su periodi lunghi)
function periodStats(months) {
  const o = odoSorted();
  if (o.length < 2) return null;
  const last = o[o.length - 1].date;
  let start = months === 'all' ? o[0].date : fromDays(days(last) - Math.round(months * 30.44));
  if (start < o[0].date) start = o[0].date;
  const r = kmBetween(start, last);
  if (!r || r.km <= 0) return null;
  const inW = x => x.date > start && x.date <= last;
  const ch = db.charges.filter(inW), fu = db.fuel.filter(inW);
  const el = ch.reduce((t, c) => t + chargeCost(c), 0), kwh = ch.reduce((t, c) => t + kwhBatt(c), 0), kwhG = ch.reduce((t, c) => t + kwhGrid(c), 0);
  const fe = fu.reduce((t, f) => t + f.total, 0), fl = fu.reduce((t, f) => t + liters(f), 0);
  const mt = db.maint.filter(inW).reduce((t, m) => t + (m.cost || 0), 0);
  // assicurazione e bollo spalmati sui giorni di validità
  let fees = 0;
  for (const f of db.fees) {
    const fs = days(f.date), fe2 = f.expiry ? days(f.expiry) : fs + 365;
    const ov = Math.min(fe2, days(last)) - Math.max(fs, days(start));
    if (ov > 0 && fe2 > fs) fees += (f.cost || 0) * ov / (fe2 - fs);
  }
  // Risparmio: quanto sarebbe costato fare gli stessi km solo a benzina (ibrido senza ricaricare)
  const lastF = [...db.fuel].sort(byDate).pop();
  const ppl = fl > 0 ? fe / fl : lastF ? lastF.ppl : null;
  const petrolOnly = ppl ? r.km * db.settings.petrolRef / 100 * ppl : null;
  return { start, end: last, km: r.km, el, kwh, kwhG, fe, fl, mt, fees, energy: el + fe, ppl, petrolOnly, saving: petrolOnly != null ? petrolOnly - (el + fe) : null };
}

// Consumo reale tra rifornimenti. Serve sapere quanta benzina c'era nel serbatoio:
//  - pieno completo: dopo = capienza, prima = capienza − litri messi
//  - livello indicato (% dell'indicatore prima di rifornire): prima = livello × capienza, dopo = prima + litri
// Benzina consumata tra A e B = (serbatoio dopo A + litri messi in mezzo senza livello) − serbatoio prima di B
function fuelIntervals() {
  const T = db.settings.tankL, out = [];
  let anchor = null, acc = 0;
  for (const f of [...db.fuel].sort(byDate)) {
    const L = liters(f);
    let before = null, after = null;
    if (f.full) { after = T; before = Math.max(0, T - L); }
    else if (f.level != null) { before = f.level / 100 * T; after = Math.min(T, before + L); }
    if (anchor && before != null) {
      const k0 = anchor.km ?? kmAt(anchor.date), k1 = f.km ?? kmAt(f.date), used = anchor.after + acc - before;
      if (k0 != null && k1 != null && k1 > k0 && used > 0) out.push({ from: anchor.date, to: f.date, km: k1 - k0, l: used, est: !(anchor.km && f.km) });
    }
    if (after != null) { anchor = { date: f.date, km: f.km, after }; acc = 0; } else if (anchor) acc += L;
  }
  return out;
}
// Benzina stimata ora nel serbatoio: dall'ultimo rifornimento con livello noto, meno i km fatti × consumo recente
function tankNow() {
  const T = db.settings.tankL, fu = [...db.fuel].sort(byDate);
  let anchor = null, acc = 0;
  for (const f of fu) {
    const L = liters(f);
    if (f.full) { anchor = { f, after: T }; acc = 0; }
    else if (f.level != null) { anchor = { f, after: Math.min(T, f.level / 100 * T + L) }; acc = 0; }
    else if (anchor) acc += L;
  }
  if (!anchor) return null;
  const o = odoSorted(); if (!o.length) return null;
  const k0 = anchor.f.km ?? kmAt(anchor.f.date), cur = o[o.length - 1];
  if (k0 == null || cur.date < anchor.f.date) return null;
  const iv = fuelIntervals().slice(-3), p = periodStats(3);
  const rate = iv.length ? iv.reduce((t, x) => t + x.l, 0) / iv.reduce((t, x) => t + x.km, 0) : p && p.km ? p.fl / p.km : null;
  if (rate == null) return null;
  const l = Math.max(0, Math.min(T, anchor.after + acc - (cur.km - k0) * rate));
  return { l, pct: l / T * 100, at: cur.date, rate };
}

// Scadenze: assicurazione/bollo (dalla data di scadenza), revisione, tagliando
const addYears = (d, n) => (+d.slice(0, 4) + n) + d.slice(4);
function kmPerDay() {
  const o = odoSorted(); if (o.length < 2) return null;
  const b = o[o.length - 1], from = fromDays(days(b.date) - 90);
  const a = o.find(x => x.date >= from) || o[0];
  const dd = days(b.date) - days(a.date);
  return dd > 0 ? (b.km - a.km) / dd : null;
}
const isService = m => m.service ?? /tagliand/i.test(m.desc || '');
function deadlines() {
  const out = [], s = db.settings, by = {};
  for (const f of db.fees) if (f.expiry && (!by[f.type] || f.expiry > by[f.type].expiry)) by[f.type] = f;
  for (const t of ['Assicurazione', 'Bollo', 'Altro']) if (by[t]) out.push({ label: t, date: by[t].expiry });
  // Revisione: dopo 4 anni dall'immatricolazione, poi ogni 2 anni
  if (by.Revisione) out.push({ label: 'Revisione', date: by.Revisione.expiry });
  else if (s.regDate) out.push({ label: 'Revisione', date: addYears(s.regDate, 4), sub: 'prima revisione' });
  else out.push({ label: 'Revisione', date: null, sub: 'Imposta la data di immatricolazione', action: 'openSettings()' });
  // Tagliando: ogni N km o N mesi, quello che arriva prima
  const last = [...db.maint].filter(isService).sort(byDate).pop();
  const baseDate = last ? last.date : s.regDate;
  if (baseDate) {
    const byTime = fromDays(days(baseDate) + Math.round(s.serviceMonths * 30.44));
    const o = odoSorted(), cur = o.length ? o[o.length - 1] : null, rate = kmPerDay();
    const baseKm = last ? (last.km ?? kmAt(last.date)) : 0;
    let kmLeft = null, date = byTime;
    if (cur && baseKm != null) {
      kmLeft = baseKm + s.serviceKm - cur.km;
      if (rate > 0) { const byKm = fromDays(days(cur.date) + Math.round(kmLeft / rate)); if (byKm < date) date = byKm; }
    }
    out.push({ label: 'Tagliando', date, kmLeft, sub: kmLeft != null ? `tra ${F0.format(Math.max(0, kmLeft))} km o entro il ${dLabel(byTime)}` : `entro il ${dLabel(byTime)}` });
  }
  return out.sort((a, b) => !a.date ? 1 : !b.date ? -1 : a.date < b.date ? -1 : 1);
}

/* ================= Render ================= */
function render() {
  document.getElementById('carName').textContent = db.settings.carName || 'Jaecoo 7';
  ({ home: renderHome, charge: renderCharge, fuel: renderFuel, km: renderKm, cost: renderCost })[state.page]();
}
const tile = (label, value, unit, dot, extra = '') =>
  `<div class="tile"><div class="l">${dot ? `<i class="dot" style="background:var(${dot})"></i>` : ''}${label}</div><div class="n num">${value}${unit ? `<small>${unit}</small>` : ''}</div>${extra}</div>`;

/* Confronto con lo stesso periodo del mese precedente (dal giorno 1 allo stesso giorno) */
function statsBetween(a, b) { // [a, b)
  const inR = x => x.date >= a && x.date < b, ch = db.charges.filter(inR), fu = db.fuel.filter(inR), r = kmBetween(a, b);
  return { el: ch.reduce((t, c) => t + chargeCost(c), 0), fuel: fu.reduce((t, f) => t + f.total, 0), km: r && !r.partial ? r.km : null };
}
function monthCompare() {
  const t = today(), k = mk(t), pk = addMonths(k, -1), d = +t.slice(8, 10);
  const pLen = new Date(+pk.slice(0, 4), +pk.slice(5, 7), 0).getDate();
  const cur = statsBetween(k + '-01', fromDays(days(t) + 1));
  const prev = statsBetween(pk + '-01', d >= pLen ? k + '-01' : pk + '-' + String(d + 1).padStart(2, '0'));
  return { cur, prev, label: `vs 1–${Math.min(d, pLen)} ${mShort(pk)}` };
}
function delta(cur, prev, lowerIsBetter, label) {
  if (cur == null || prev == null || prev < 0.01) return '';
  const p = (cur - prev) / prev * 100;
  if (Math.abs(p) < 1) return `<div class="delta">= <span>${label}</span></div>`;
  const cls = lowerIsBetter == null ? '' : (p < 0) === lowerIsBetter ? 'good' : 'bad';
  return `<div class="delta ${cls}">${p > 0 ? '▲' : '▼'} ${F0.format(Math.abs(p))}% <span>${label}</span></div>`;
}

/* Illustrazione dell'auto: SUV compatto visto di lato, colore carrozzeria dalle impostazioni */
function shade(hex, t) { // t>0 schiarisce verso il bianco, t<0 scurisce verso il nero
  const n = parseInt((hex || '#C3C7CC').slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + c.map(v => Math.round(t > 0 ? v + (255 - v) * t : v * (1 + t)).toString(16).padStart(2, '0')).join('');
}

function heroCard() {

  const photo = getPhoto(), p3 = periodStats(3);

    </div></div>`;
}

    ${kmTile}

    ${tile('Elettricità', F2.format(m.el), '€', '--el', delta(mc.cur.el, mc.prev.el, true, L))}
    ${tile('Benzina', F2.format(m.fuelEur), '€', '--fuel', delta(mc.cur.fuel, mc.prev.fuel, true, L))}
  </div>`;

  // Scadenze
  const due = deadlines();
  if (due.length) {
    h += `<h2>Scadenze</h2><div class="group">` + due.map(f => {
      if (!f.date) return `<button class="row" onclick="${f.action}"><div class="main"><div class="t">${esc(f.label)}</div><div class="s">${esc(f.sub)}</div></div><span class="chev">›</span></button>`;
      const d = Math.round(days(f.date) - days(today()));
      const cls = d < 0 || (f.kmLeft != null && f.kmLeft < 0) ? 'bad' : d <= 30 || (f.kmLeft != null && f.kmLeft < 1000) ? 'warn' : '';
      const txt = d < 0 ? `scaduta da ${-d} gg` : d === 0 ? 'oggi' : `tra ${d} gg`;
      return `<div class="row"><div class="main"><div class="t">${esc(f.label)}</div><div class="s">${f.label === 'Tagliando' ? 'stimato ' + dLabel(f.date) + ' · ' + esc(f.sub) : dLabel(f.date) + (f.sub ? ' · ' + esc(f.sub) : '')}</div></div><div class="v"><span class="pill ${cls}">${txt}</span></div></div>`;
    }).join('') + `</div>`;
  }

  // Consumi medi
  h += consumiSection();

  // Grafico spesa mensile
  const months = allMonths().slice(-6);
  h += `<h2>Spesa energia mensile</h2>` + spendChart(months);
  h += yearDonut();
  h += `<h2>Andamento costo per km</h2>` + trendChart();

  // Statistiche
  const R = state.range;
  h += `<h2>Statistiche</h2><div class="segc" id="seg-range">
    <button data-v="3" class="${R==='3'?'on':''}">3 mesi</button><button data-v="6" class="${R==='6'?'on':''}">6 mesi</button><button data-v="12" class="${R==='12'?'on':''}">12 mesi</button><button data-v="all" class="${R==='all'?'on':''}">Tutto</button></div>`;
  const p = periodStats(R === 'all' ? 'all' : +R);
  if (!p) h += `<div class="group"><div class="empty">Servono almeno due letture dei km.</div></div>`;
  else {
    const k100 = p.km / 100;
    h += `<div class="tiles" style="margin-top:8px">
      ${tile('Costo energia', F2.format(p.energy / k100), '€/100 km')}
      ${tile('Km percorsi', F0.format(p.km), 'km')}
      ${tile('Benzina', F1.format(p.fl / k100), 'L/100 km', '--fuel')}
      ${tile('Elettricità', F1.format(p.kwh / k100), 'kWh/100 km', '--el')}
      ${tile('Quota elettrica', p.energy ? F0.format(p.el / p.energy * 100) : '–', '% spesa')}
      ${tile('Tutto incluso', F2.format((p.energy + p.mt + p.fees) / p.km), '€/km')}
      ${p.saving != null ? `<div class="tile wide save"><div class="l">Risparmio rispetto a solo benzina</div><div class="n num">${F0.format(p.saving)}<small>€</small></div>
        <div class="s num">Solo benzina avresti speso circa ${eur(p.petrolOnly)} (${F1.format(db.settings.petrolRef)} L/100 km a ${F3.format(p.ppl)} €/L), invece di ${eur(p.energy)}.</div></div>` : ''}
    </div>
    <p class="note">Dal ${dLabel(p.start)} al ${dLabel(p.end)} (ultima lettura km). Consumi medi su tutti i km percorsi: benzina e kWh acquistati nel periodo divisi per i km. Più lungo è il periodo, più il dato è affidabile. "Tutto incluso" aggiunge manutenzioni e la quota di assicurazione e bollo. Il consumo "solo benzina" di riferimento si imposta nelle Impostazioni.</p>`;
  }

  // Report mensile
  const rows = allMonths().slice().reverse().map(k => {
    const s = monthStats(k), tot = s.el + s.fuelEur;
    return `<tr><td>${mShort(k)} ${k.slice(2,4)}</td><td>${s.km != null ? F0.format(s.km) + (s.kmPartial ? '*' : '') : '–'}</td><td>${F2.format(s.el)}</td><td>${F2.format(s.fuelEur)}</td><td>${F2.format(tot)}</td><td>${s.km && !s.kmPartial ? F2.format(tot / s.km * 100) : '–'}</td></tr>`;
  }).join('');
  h += `<h2>Report mensile</h2><div class="group scrollx"><table class="rep num"><tr><th>Mese</th><th>Km</th><th>Elettr. €</th><th>Benz. €</th><th>Tot. €</th><th>€/100</th></tr>${rows}</table></div>
  <p class="note">* mese coperto solo in parte dalle letture km. Il €/100 km del singolo mese è indicativo: un pieno fatto a fine mese pesa tutto su quel mese.</p>`;

  document.getElementById('home').innerHTML = h;
  bindSeg('seg-range', v => { state.range = v; render(); });
  document.querySelectorAll('#donut [data-c]').forEach(b => b.onclick = () => { state.donutSel = state.donutSel === +b.dataset.c ? null : +b.dataset.c; render(); });
  bindSeg('seg-year', v => { state.year = v; state.donutSel = null; render(); });
  bindChart('trend', i => { state.trendSel = state.trendSel === i ? null : i; render(); });
  bindChart('cons-c', i => { state.consCSel = state.consCSel === i ? null : i; render(); });
  bindChart('cons-l', i => { state.consLSel = state.consLSel === i ? null : i; render(); });
  bindChart('cons-k', i => { state.consKSel = state.consKSel === i ? null : i; render(); });
  bindChart('spend', i => { state.chartSel = state.chartSel === i ? null : i; render(); });
}

function latestFees() {
  const by = {};
  for (const f of db.fees) if (f.expiry && (!by[f.type] || f.expiry > by[f.type].expiry)) by[f.type] = f;
  return Object.values(by).sort((a, b) => a.expiry < b.expiry ? -1 : 1);
}

/* Grafico a barre impilate: elettricità (base) + benzina */
function spendChart(months) {
  const data = months.map(monthStats);
  const W = 340, H = 170, pl = 34, pb = 20, pt = 8, iw = W - pl - 4, ih = H - pb - pt;
  const max = Math.max(10, ...data.map(d => d.el + d.fuelEur));
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const y = v => pt + ih - v / top * ih;
  const bw = Math.min(28, iw / data.length * .5), gap = 2;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${F0.format(v)}</text>`;
  data.forEach((d, i) => {
    const cx = pl + iw * (i + .5) / data.length;
    if (state.chartSel === i) g += `<rect class="sel" x="${cx - iw / data.length / 2 + 2}" y="${pt}" width="${iw / data.length - 4}" height="${ih}" rx="6"/>`;
    const hE = d.el / top * ih, hF = d.fuelEur / top * ih;
    const yE = pt + ih - hE, yF = yE - (hE > 0 && hF > 0 ? gap : 0) - hF;
    if (hE > 0) g += hF > 0 ? `<rect x="${cx - bw/2}" y="${yE}" width="${bw}" height="${hE}" fill="var(--el)"/>` : roundTop(cx - bw/2, yE, bw, hE, 'var(--el)');
    if (hF > 0) g += roundTop(cx - bw/2, yF, bw, hF, 'var(--fuel)');
    g += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${mShort(d.k)}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${cx - iw / data.length / 2}" y="0" width="${iw / data.length}" height="${H}"/>`;
  });
  const sel = state.chartSel != null ? data[state.chartSel] : null;
  const tot = data.reduce((t, d) => t + d.el + d.fuelEur, 0);
  const head = sel
    ? `<div><div class="sub">${mLabel(sel.k)}</div><div class="big num">${eur(sel.el + sel.fuelEur)}</div></div><div class="sub num" style="text-align:right">Elettricità ${eur(sel.el)}<br>Benzina ${eur(sel.fuelEur)}</div>`
    : `<div><div class="sub">Ultimi ${data.length} mesi</div><div class="big num">${eur(tot)}</div></div><div class="sub">Tocca una barra</div>`;
  return `<div class="chart" id="spend"><div class="head">${head}</div><svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spesa mensile elettricità e benzina">${g}</svg>
    <div class="legend"><span><i class="dot" style="background:var(--el)"></i>Elettricità</span><span><i class="dot" style="background:var(--fuel)"></i>Benzina</span></div></div>`;
}
/* Ciambella della spesa dell'anno. Ordine fisso dei colori (validato per daltonismo sugli spicchi adiacenti) */
function yearDonut() {
  const years = [...new Set([...db.charges, ...db.fuel, ...db.maint, ...db.fees].map(x => x.date.slice(0, 4)))].sort();
  if (!years.length) return '';
  const Y = years.includes(state.year) ? state.year : years[years.length - 1];
  const inY = x => x.date.slice(0, 4) === Y, sum = (a, f) => a.filter(inY).reduce((t, x) => t + f(x), 0);
  const cats = [
    { n: 'Elettricità', c: 'var(--el)', v: sum(db.charges, chargeCost) },
    { n: 'Manutenzione', c: 'var(--maint)', v: sum(db.maint, m => m.cost || 0) },
    { n: 'Benzina', c: 'var(--fuel)', v: sum(db.fuel, f => f.total) },
    { n: 'Assicurazione e bollo', c: 'var(--fees)', v: sum(db.fees, f => f.cost || 0) },
  ];
  const tot = cats.reduce((t, c) => t + c.v, 0);
  if (!tot) return '';
  const R = 70, r = 46, cx = 80, cy = 80, sel = state.donutSel;
  let a = -Math.PI / 2, g = '';
  const pt = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
  cats.forEach((c, i) => {
    if (!c.v) return;
    const sw = c.v / tot * Math.PI * 2, b = a + sw, big = sw > Math.PI ? 1 : 0, out = sel === i ? 4 : 0;
    const d = sw >= Math.PI * 2 - 1e-6
      ? `M${pt(R, 0)}A${R},${R} 0 1 1 ${pt(R, Math.PI)}A${R},${R} 0 1 1 ${pt(R, 0)}M${pt(r, 0)}A${r},${r} 0 1 0 ${pt(r, Math.PI)}A${r},${r} 0 1 0 ${pt(r, 0)}Z`
      : `M${pt(R + out, a)}A${R + out},${R + out} 0 ${big} 1 ${pt(R + out, b)}L${pt(r, b)}A${r},${r} 0 ${big} 0 ${pt(r, a)}Z`;
    g += `<path d="${d}" fill="${c.c}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" ${sel != null && sel !== i ? 'opacity=".35"' : ''} data-c="${i}" style="cursor:pointer"/>`;
    a = b;
  });
  const s = sel != null ? cats[sel] : null;
  g += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-size:11px;fill:var(--ink2)">${s ? esc(s.n.split(' ')[0]) : 'Totale ' + Y}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="num" style="font-size:17px;font-weight:600;fill:var(--ink)">${F0.format(s ? s.v : tot)} €</text>`;
  const leg = cats.map((c, i) => `<button data-c="${i}" class="${sel != null && sel !== i ? 'dim' : ''}"><i class="dot" style="background:${c.c}"></i><span class="nm">${c.n}<br><span class="vl">${F0.format(c.v)} € · ${F0.format(c.v / tot * 100)}%</span></span></button>`).join('');
  const seg = years.length > 1 ? `<div class="segc" id="seg-year" style="margin-bottom:10px">${years.map(y => `<button data-v="${y}" class="${y === Y ? 'on' : ''}">${y}</button>`).join('')}</div>` : '';
  return `<h2>Spesa totale ${Y}</h2>${seg}<div class="chart" id="donut"><div class="donut-wrap"><svg viewBox="0 0 160 160" role="img" aria-label="Spesa ${Y} per categoria">${g}</svg><div class="donut-leg">${leg}</div></div></div>
    <p class="note">Tutto quello che hai speso per l'auto nell'anno, per categoria. Tocca una voce per evidenziarla.</p>`;
}
/* Grafico a linea generico (una sola serie, tocca un punto per il dettaglio) */
function lineChart({ id, data, sel, color, fmt, unit, avgLabel, aria, detail, area, showLast }) {
  if (data.length < 2) return `<div class="group"><div class="empty">Servono almeno due mesi completi di letture km.</div></div>`;
  const W = 340, H = 140, pl = 30, pb = 20, pt = 10, iw = W - pl - 10, ih = H - pb - pt;
  const max = Math.max(...data.map(d => d.v)), step = niceStep(max / 3 || 1), top = Math.ceil(max / step) * step || 1;
  const x = i => pl + iw * i / (data.length - 1), y = v => pt + ih - v / top * ih;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${step < 1 ? F1.format(v) : F0.format(v)}</text>`;
  if (sel != null && data[sel]) g += `<line x1="${x(sel)}" x2="${x(sel)}" y1="${pt}" y2="${pt + ih}" stroke="var(--ink3)" stroke-width="1"/>`;
  const line = data.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(d.v).toFixed(1)).join('');
  if (area) g += `<path d="${line}L${x(data.length - 1)},${pt + ih}L${x(0)},${pt + ih}Z" fill="${color}" opacity=".12"/>`;
  g += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  data.forEach((d, i) => {
    g += `<circle cx="${x(i)}" cy="${y(d.v)}" r="${sel === i ? 5 : 3.5}" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;
    if (data.length <= 8 || i % 2 === (data.length - 1) % 2) g += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${mShort(d.k)}</text>`;
    const w = iw / (data.length - 1);
    g += `<rect class="hit" data-i="${i}" x="${x(i) - w / 2}" y="0" width="${w}" height="${H}"/>`;
  });
  const avg = data.reduce((t, d) => t + d.v, 0) / data.length, s = sel != null ? data[sel] : null, lastD = data[data.length - 1];
  const head = s ? `<div><div class="sub">${mLabel(s.k)}</div><div class="big num">${fmt(s.v)} ${unit}</div></div>${detail ? `<div class="sub num" style="text-align:right">${detail(s)}</div>` : ''}`
    : `<div><div class="sub">${avgLabel}${showLast ? ' · ' + mShort(lastD.k) : ''}</div><div class="big num">${fmt(showLast ? lastD.v : avg)} ${unit}</div></div><div class="sub">Tocca un mese</div>`;
  return `<div class="chart" id="${id}"><div class="head">${head}</div><svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${g}</svg></div>`;
}
/* €/100 km per i mesi completi (ultimi 12) */
function trendChart() {
  const data = allMonths().map(monthStats).filter(s => s.km > 0 && !s.kmPartial).slice(-12)
    .map(s => ({ k: s.k, v: (s.el + s.fuelEur) / s.km * 100, el: s.el / s.km * 100 }));
  return lineChart({ id: 'trend', data, sel: state.trendSel, color: 'var(--ink)', fmt: v => F2.format(v), unit: '€/100 km', avgLabel: 'Media mensile',
    aria: 'Costo energia per 100 km, mese per mese', detail: s => `di cui elettricità<br>${F2.format(s.el)} €/100 km` })
    + `<p class="note">Elettricità + benzina acquistate nel mese, diviso i km del mese. Un pieno fatto a fine mese alza quel mese e abbassa il successivo.</p>`;
}
/* Consumi medi: media mobile su 3 mesi per smussare l'effetto dei rifornimenti */
function consMonths() {
  const ms = allMonths().map(monthStats), out = [];
  ms.forEach((s, i) => {
    if (!(s.km > 0) || s.kmPartial) return;
    const w = ms.slice(Math.max(0, i - 2), i + 1).filter(x => x.km > 0 && !x.kmPartial);
    const sum = f => w.reduce((t, x) => t + f(x), 0);
    const km = sum(x => x.km), fl = sum(x => x.fuelL), kwhG = sum(x => x.kwhHomeGrid + x.kwhPub);
    out.push({ k: s.k, l: fl / km * 100, kwh: sum(x => x.kwhB) / km * 100, n: w.length,
      elL: kwhG / KWH_PER_L / km * 100,          // elettricità convertita in litri (energia)
      comb: (fl + kwhG / KWH_PER_L) / km * 100 }); // consumo combinato, litri equivalenti
  });
  return out.slice(-12);
}
// 1 litro di benzina ≈ 8,9 kWh di energia (stesso valore usato per l'MPGe: 33,7 kWh per gallone)
const KWH_PER_L = 8.9;
function consumiSection() {
  const p = periodStats(3), s = db.settings;
  if (!p) return '';
  const k100 = p.km / 100, lkm = p.fl / k100, kwhkm = p.kwh / k100;
  const evKm = Math.min(p.km, p.kwh / s.evCons * 100), iv = fuelIntervals(), last = iv[iv.length - 1];
  const tank = lkm > 0 ? s.tankL / lkm * 100 : null;
  const cm = consMonths();
  const elL = p.kwhG / KWH_PER_L / k100, comb = lkm + elL;
  let h = `<h2>Consumi medi<span>ultimi 3 mesi</span></h2><div class="tiles">
    <div class="tile wide"><div class="l">Consumo combinato (benzina + elettricità)</div>
      <div class="n num">${F1.format(comb)}<small>L/100 km equivalenti</small></div>
      <div class="combo"><i style="width:${comb ? lkm / comb * 100 : 0}%;background:var(--fuel)"></i><i style="width:${comb ? elL / comb * 100 : 0}%;background:var(--el)"></i></div>
      <div class="s num"><span class="dot" style="background:var(--fuel)"></span> ${F1.format(lkm)} L di benzina + <span class="dot" style="background:var(--el)"></span> ${F1.format(elL)} L dall'elettricità (${F1.format(p.kwhG / k100)} kWh dalla rete ÷ ${F1.format(KWH_PER_L)})</div></div>
    ${tile('Benzina', F1.format(lkm), 'L/100 km', '--fuel')}
    ${tile('Elettricità', F1.format(kwhkm), 'kWh/100 km', '--el')}
    ${tile('Km in elettrico', F0.format(evKm / p.km * 100), '% stimato')}
    ${last ? tile('Consumo reale', F1.format(last.l / last.km * 100), 'L/100 km') : tile('Un pieno dura', tank ? F0.format(tank) : '–', 'km')}
  </div>
  <p class="note">Benzina e kWh caricati nel periodo, divisi per tutti i km percorsi (elettrici + benzina). ${tank ? `Con ${F0.format(s.tankL)} L e queste ricariche un pieno ti dura circa ${F0.format(tank)} km, contro i ${F0.format(s.rangeMax)} km che l'auto indica col serbatoio pieno (stima in ibrido, senza ricariche).` : ''} I km in elettrico sono stimati con ${F0.format(s.evCons)} kWh/100 km.</p>`;
  if (cm.length >= 2) {
    h += `<div style="height:10px"></div>` + lineChart({ id: 'cons-c', data: cm.map(x => ({ k: x.k, v: x.comb, x })), sel: state.consCSel, color: 'var(--ink)', area: true, showLast: true,
      fmt: v => F1.format(v), unit: 'L/100 km eq.', avgLabel: 'Combinato · media mobile 3 mesi', aria: 'Consumo combinato in litri equivalenti, media mobile 3 mesi',
      detail: d => `benzina ${F1.format(d.x.l)}<br>elettricità ${F1.format(d.x.elL)}` });
    h += `<div style="height:10px"></div>` + lineChart({ id: 'cons-l', data: cm.map(x => ({ k: x.k, v: x.l })), sel: state.consLSel, color: 'var(--fuel)', area: true, showLast: true,
      fmt: v => F1.format(v), unit: 'L/100 km', avgLabel: 'Benzina · media mobile 3 mesi', aria: 'Consumo di benzina, media mobile 3 mesi' });
    h += `<div style="height:10px"></div>` + lineChart({ id: 'cons-k', data: cm.map(x => ({ k: x.k, v: x.kwh })), sel: state.consKSel, color: 'var(--el)', area: true, showLast: true,
      fmt: v => F1.format(v), unit: 'kWh/100 km', avgLabel: 'Elettricità · media mobile 3 mesi', aria: 'Consumo elettrico, media mobile 3 mesi' });
    h += `<p class="note">Ogni punto è la media dei 3 mesi fino a quello indicato: così un pieno fatto a fine mese non crea picchi.</p>`;
  }
  return h;
}
function roundTop(x, y, w, h, fill) {
  const r = Math.min(4, h, w / 2);
  return `<path d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z" fill="${fill}"/>`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function bindChart(id, fn) {
  const el = document.getElementById(id);
  if (el) el.querySelectorAll('.hit').forEach(r => r.addEventListener('click', () => fn(+r.dataset.i)));
}
function bindSeg(id, fn) {
  const el = document.getElementById(id);
  if (el) el.querySelectorAll('button').forEach(b => b.onclick = () => fn(b.dataset.v));
}
function setSeg(id, v) { document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }

/* ---------- Ricariche ---------- */
function renderCharge() {
  setSeg('seg-charge', state.chargeView);
  const cur = tariffAt(today());
  let h = `<h2>Tariffa casa</h2><div class="group"><button class="row" onclick="openTariffs()"><div class="main"><div class="t">Prezzo in bolletta</div><div class="s">Inseriscilo solo quando cambia</div></div><div class="v num">${cur != null ? F5(cur) + ' €/kWh' : 'da impostare'}</div><span class="chev">›</span></button></div>`;
  const list = [...db.charges].sort(byDate).reverse();
  if (list.length) h += `<h2>Calendario ricariche<span>ultime 18 settimane</span></h2>` + chargeCalendar();
  if (!list.length) h += `<h2>&nbsp;</h2><div class="group"><div class="empty">Nessuna ricarica. Tocca + per aggiungerne una.</div></div>`;
  else if (state.chargeView === 'list') {
    const groups = groupBy(list, c => mk(c.date));

    }

        ${s.kwhHome ? kv('Costo casa', eur(s.elHome)) : ''}
        ${s.kwhPub ? kv('Colonnina', F1.format(s.kwhPub) + ' kWh · ' + eur(s.elPub)) : ''}
        ${kv('<b>Totale</b>', '<b>' + eur(s.el) + '</b>')}
      </div>`;

/* Calendario stile "Attività": una colonna per settimana, un quadratino per giorno, colore = kWh caricati */
function chargeCalendar() {
  const W = 18, t = today(), td = days(t), dow = (new Date(td * 864e5).getUTCDay() + 6) % 7; // 0 = lunedì
  const start = td - dow - (W - 1) * 7, by = {};
  for (const c of db.charges) { const d = days(c.date); if (d >= start && d <= td) by[d] = (by[d] || { kwh: 0, n: 0 }), by[d].kwh += kwhBatt(c), by[d].n++; }
  const lvl = k => !k ? 0 : k < 4 ? 1 : k < 8 ? 2 : k < 12 ? 3 : 4, op = [0, .3, .55, .8, 1];
  const cs = 16, gp = 3, pl = 16, pt = 14, Wd = pl + W * (cs + gp), Hd = pt + 7 * (cs + gp);
  let g = '', lastM = -1, lastW = -9, cells = [];
  ['L', '', 'M', '', 'V', '', 'D'].forEach((l, i) => l && (g += `<text x="0" y="${pt + i * (cs + gp) + 12}">${l}</text>`));
  for (let w = 0; w < W; w++) {
    // etichetta del mese sulla colonna che contiene il giorno 1 (o sulla prima, se il mese successivo non è vicino)
    const d0 = start + w * 7, m = +fromDays(d0 + 6).slice(5, 7), nextM = +fromDays(d0 + 13).slice(5, 7);
    if (m !== lastM) {
      lastM = m;
      if (w - lastW >= 3 && !(w === 0 && nextM !== m) && w < W - 1) { g += `<text x="${pl + w * (cs + gp)}" y="10">${MESI[m - 1]}</text>`; lastW = w; }
    }
    for (let i = 0; i < 7; i++) {
      const d = d0 + i; if (d > td) continue;
      const v = by[d], idx = cells.length, x = pl + w * (cs + gp), y = pt + i * (cs + gp);
      cells.push({ d, v });
      g += `<rect class="d" rx="3.5" x="${x}" y="${y}" width="${cs}" height="${cs}" fill="${v ? 'var(--el)' : 'var(--fill)'}" ${v ? `fill-opacity="${op[lvl(v.kwh)]}"` : ''} ${state.calSel === idx ? 'stroke="var(--ink)" stroke-width="2"' : ''}/>`;
      g += `<rect class="hit" data-i="${idx}" x="${x - 1}" y="${y - 1}" width="${cs + gp}" height="${cs + gp}"/>`;
    }
  }
  const sel = state.calSel != null ? cells[state.calSel] : null;
  const inR = cells.filter(c => c.v), tot = inR.reduce((s, c) => s + c.v.kwh, 0), n = inR.reduce((s, c) => s + c.v.n, 0);
  const head = sel ? `<div><div class="sub">${dLabel(fromDays(sel.d))}</div><div class="big num">${sel.v ? F1.format(sel.v.kwh) + ' kWh' : 'Nessuna ricarica'}</div></div>${sel.v && sel.v.n > 1 ? `<div class="sub">${sel.v.n} ricariche</div>` : ''}`
    : `<div><div class="sub">${n} ricariche in ${inR.length} giorni</div><div class="big num">${F0.format(tot)} kWh</div></div><div class="sub">Tocca un giorno</div>`;
  return `<div class="chart" id="cal"><div class="head">${head}</div><svg class="plot cal" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Calendario delle ricariche">${g}</svg>
    <div class="cal-legend">meno <i style="background:var(--fill)"></i>${op.slice(1).map(o => `<i style="background:var(--el);opacity:${o}"></i>`).join('')} più kWh</div></div>`;
}
const kv = (k, v) => `<div class="row"><div class="main">${k}</div><div class="v num">${v}</div></div>`;
function groupBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

      const s = monthStats(k);

        <button class="row" onclick="editFuel('${f.id}')"><div class="main"><div class="t">${dShort(f.date)}${f.full ? '<span class="pill">Pieno</span>' : ''}</div><div class="s num">${F3.format(f.ppl)} €/L${f.km ? ' · ' + F0.format(f.km) + ' km' : ''}</div></div>
        <div class="v"><div class="num">${eur(f.total)}</div><div class="s num">${F2.format(liters(f))} L</div></div></button>`)).join('') + `</div>`;
    }
  } else {
    const rows = allMonths().slice().reverse().map(k => {
      const s = monthStats(k);

    const tot = list.reduce((t, f) => t + f.total, 0), tl = list.reduce((t, f) => t + liters(f), 0);
    h += `<h2>Per mese</h2><div class="group scrollx"><table class="rep num"><tr><th>Mese</th><th>N.</th><th>Litri</th><th>€/L medio</th><th>Totale</th></tr>${rows}
      <tr><td><b>Totale</b></td><td>${list.length}</td><td>${F1.format(tl)}</td><td>${F3.format(tot / tl)}</td><td><b>${F2.format(tot)}</b></td></tr></table></div>`;
  }
  document.getElementById('fuel').innerHTML = h;
}

/* ---------- Km ---------- */
function renderKm() {
  const o = [...odoSorted()].reverse();
  const SRC = { charge: ['da ricarica', 'editCharge'], fuel: ['da rifornimento', 'editFuel'], maint: ['da manutenzione', 'editMaint'], odo: ['', 'editOdo'] };
  let h = '';
  const months = allMonths().map(k => ({ k, r: kmBetween(k + '-01', addMonths(k, 1) + '-01') })).filter(x => x.r);
  if (months.length) {
    const last6 = months.slice(-6);
    h += `<h2>Km al mese</h2>` + kmChart(last6);
    h += `<div class="group" style="margin-top:10px">` + months.slice().reverse().map(x =>
      kv(mLabel(x.k) + (x.r.partial ? ' <span class="pill">parziale</span>' : ''), F0.format(x.r.km) + ' km')).join('') + `</div>
      <p class="note">Calcolati dalle letture del contachilometri, anche se non le fai il primo del mese: tra due letture i km vengono distribuiti in modo uniforme sui giorni.</p>`;
  }
  h += `<h2>Letture contachilometri</h2><div class="group">` + (o.length ? o.map((r, i) => {
    const prev = o[i + 1];
    const [lbl, fn] = SRC[r.src];
    const info = [prev ? `+${F0.format(r.km - prev.km)} km in ${Math.round(days(r.date) - days(prev.date))} gg` : '', lbl].filter(Boolean).join(' · ');
    const row = `<button class="row" onclick="${fn}('${r.id}')"><div class="main"><div class="t">${dLabel(r.date)}</div>${info ? `<div class="s num">${info}</div>` : ''}</div><div class="v num">${F0.format(r.km)} km</div><span class="chev">›</span></button>`;
    return r.src === 'odo' ? sw('odo', r.id, row) : `<div class="sw">${row}</div>`;
  }).join('') : `<div class="empty">Aggiungi la lettura dei km (ad esempio il primo di ogni mese).</div>`) + `</div>`;
  document.getElementById('km').innerHTML = h;
  bindChart('kmchart', i => { state.kmSel = state.kmSel === i ? null : i; render(); });
}
function kmChart(arr) {
  const W = 340, H = 150, pl = 40, pb = 20, pt = 8, iw = W - pl - 4, ih = H - pb - pt;
  const max = Math.max(100, ...arr.map(x => x.r.km)), step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const y = v => pt + ih - v / top * ih, bw = Math.min(28, iw / arr.length * .5);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${F0.format(v)}</text>`;
  arr.forEach((x, i) => {
    const cx = pl + iw * (i + .5) / arr.length, hh = x.r.km / top * ih;
    if (state.kmSel === i) g += `<rect class="sel" x="${cx - iw / arr.length / 2 + 2}" y="${pt}" width="${iw / arr.length - 4}" height="${ih}" rx="6"/>`;
    g += roundTop(cx - bw / 2, pt + ih - hh, bw, hh, 'var(--blue)');
    g += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${mShort(x.k)}</text><rect class="hit" data-i="${i}" x="${cx - iw / arr.length / 2}" y="0" width="${iw / arr.length}" height="${H}"/>`;
  });
  const sel = state.kmSel != null ? arr[state.kmSel] : null;
  const avg = arr.filter(x => !x.r.partial), a = avg.length ? avg.reduce((t, x) => t + x.r.km, 0) / avg.length : null;
  const head = sel ? `<div><div class="sub">${mLabel(sel.k)}${sel.r.partial ? ' (parziale)' : ''}</div><div class="big num">${F0.format(sel.r.km)} km</div></div>`
    : `<div><div class="sub">Media mesi completi</div><div class="big num">${a != null ? F0.format(a) + ' km' : '–'}</div></div><div class="sub">Tocca una barra</div>`;
  return `<div class="chart" id="kmchart"><div class="head">${head}</div><svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Km percorsi al mese">${g}</svg></div>`;
}

/* ================= Fogli di modifica ================= */
let sheetSave = null;
function openSheet(title, body, onSave, onDelete) {
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="bar"><button onclick="closeSheet()">Annulla</button><b>${title}</b><button id="sv">${onSave ? 'Salva' : ''}</button></div>${body}
    ${onDelete ? `<div class="group" style="margin-top:28px"><button class="row danger" id="del">Elimina</button></div>` : ''}`;
  sheetSave = onSave;
  if (onSave) s.querySelector('#sv').onclick = () => { if (onSave() !== false) closeSheet(); };
  if (onDelete) s.querySelector('#del').onclick = () => { if (confirm('Eliminare questa voce?')) { onDelete(); closeSheet(); } };
  document.getElementById('scrim').classList.add('on'); s.classList.add('on'); s.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeSheet() { document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); document.body.style.overflow = ''; }
const fld = (label, id, val, opt = {}) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" ${opt.type === 'date' ? 'type="date"' : opt.type === 'text' ? 'type="text"' : 'type="text" inputmode="decimal"'} value="${esc(val ?? '')}" placeholder="${esc(opt.ph || '')}">${opt.u ? `<span class="u">${opt.u}</span>` : ''}</div>`;
const val = id => document.getElementById(id).value;
const fmtIn = (v, d) => v == null ? '' : String(+v.toFixed(d)).replace('.', ',');
function upsert(arr, obj) { const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }
function remove(arr, id) { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); save(); }
function need(cond, msg) { if (!cond) toast(msg); return !!cond; }
// Controllo di coerenza del contachilometri rispetto alle altre letture
function kmOk(date, km, selfId) {
  if (km == null) return true;
  const o = odoSorted().filter(r => r.id !== selfId);
  const before = o.filter(r => r.date < date).pop(), after = o.find(r => r.date > date);
  if (before && km < before.km) return confirm(`${F0.format(km)} km è meno della lettura del ${dLabel(before.date)} (${F0.format(before.km)} km). Salvare comunque?`);
  if (after && km > after.km) return confirm(`${F0.format(km)} km è più della lettura del ${dLabel(after.date)} (${F0.format(after.km)} km). Salvare comunque?`);
  return true;
}
const switchFld = (label, id, on) => `<div class="field"><label for="${id}" style="flex:1;width:auto">${label}</label><input type="checkbox" class="switch" id="${id}" ${on ? 'checked' : ''}></div>`;
const kmPh = () => { const o = odoSorted(); return o.length ? 'ultima ' + F0.format(o[o.length - 1].km) : 'facoltativo'; };

function editCharge(id) {
  const c = db.charges.find(x => x.id === id) || { id: uid(), date: today(), start: null, end: 100, kwh: null, place: 'casa', cost: null };
  openSheet(id ? 'Ricarica' : 'Nuova ricarica', `
    <div class="group">${fld('Data', 'c-date', c.date, { type: 'date' })}
      <div class="field"><label>Dove</label><div class="segc" id="c-place"><button data-v="casa">Casa</button><button data-v="colonnina">Colonnina</button></div></div>
      ${fld('Inizio', 'c-start', c.start, { u: '%', ph: '25' })}${fld('Fine', 'c-end', c.end, { u: '%', ph: '100' })}
      ${fld('kWh caricati', 'c-kwh', fmtIn(c.kwh, 3), { u: 'kWh', ph: 'auto' })}
      <div id="c-pubbox">${fld('Costo totale', 'c-cost', fmtIn(c.cost, 2), { u: '€', ph: '0,00' })}</div>
      ${fld('Contachilometri', 'c-km', c.km, { u: 'km', ph: kmPh() })}</div>
    <div class="preview num" id="c-prev"></div>
    <p class="note">Lascia "kWh caricati" vuoto per calcolarli da capacità batteria (${F1.format(db.settings.capacity)} kWh) × differenza di percentuale. Se il dato lo leggi dall'auto o dalla colonnina, inseriscilo. I km sono facoltativi: se li scrivi valgono come lettura del contachilometri.</p>`,
    () => {
      const o = { id: c.id, date: val('c-date'), start: num(val('c-start')), end: num(val('c-end')), kwh: num(val('c-kwh')), place: c.place, cost: c.place === 'casa' ? null : num(val('c-cost')), km: num(val('c-km')) };
      if (!need(o.date && o.start != null && o.end != null && o.end > o.start && o.end <= 100 && o.start >= 0, 'Controlla data e percentuali')) return false;
      if (o.place !== 'casa' && !need(o.cost != null, 'Inserisci il costo della colonnina')) return false;
      if (!kmOk(o.date, o.km, c.id)) return false;
      upsert(db.charges, o); save(); toast('Ricarica salvata');
    }, id && (() => remove(db.charges, id)));
  const upd = () => {
    setSeg('c-place', c.place);
    document.getElementById('c-pubbox').style.display = c.place === 'casa' ? 'none' : '';
    const t = { date: val('c-date'), start: num(val('c-start')), end: num(val('c-end')), kwh: num(val('c-kwh')), place: c.place, cost: num(val('c-cost')) };
    const p = document.getElementById('c-prev');
    if (t.start == null || t.end == null || t.end <= t.start) { p.innerHTML = ''; return; }
    if (t.place === 'casa') {
      const tr = tariffAt(t.date);
      p.innerHTML = `<b>${F1.format(kwhBatt(t))} kWh</b> in batteria · ${F1.format(kwhGrid(t))} kWh dalla rete · ` + (tr != null ? `<b>${eur(chargeCost(t))}</b>` : `<span style="color:var(--orange)">imposta la tariffa casa</span>`);
    } else p.innerHTML = `<b>${F1.format(kwhBatt(t))} kWh</b>` + (t.cost ? ` · ${F3.format(t.cost / kwhBatt(t))} €/kWh` : '');
  };
  bindSeg('c-place', v => { c.place = v; upd(); });
  ['c-date', 'c-start', 'c-end', 'c-kwh', 'c-cost'].forEach(i => document.getElementById(i).addEventListener('input', upd));
  upd();
  if (!id) setTimeout(() => document.getElementById('c-start').focus(), 350);
}
