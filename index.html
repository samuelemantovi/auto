    ${fld('Contachilometri', 'f-km', f.km, { u: 'km', ph: kmPh() })}
    ${switchFld('Pieno completo', 'f-full', f.full)}
    <div id="f-lvlbox">${fld('Livello prima', 'f-lvl', f.level, { u: '%', ph: 'facoltativo' })}</div></div>
    <div class="preview num" id="f-prev"></div>
    <p class="note">Attiva "Pieno completo" quando riempi il serbatoio fino allo scatto. Se non fai il pieno puoi indicare il livello dell'indicatore prima di rifornire (es. 25% = un quarto). Con uno dei due l'app calcola il consumo reale e la benzina rimasta nel serbatoio da ${F0.format(db.settings.tankL)} L.</p>`,
    () => {
      const full = document.getElementById('f-full').checked;
      const o = { id: f.id, date: val('f-date'), total: num(val('f-tot')), ppl: num(val('f-ppl')), km: num(val('f-km')), full, level: full ? null : num(val('f-lvl')) };
      if (!need(o.date && o.total > 0 && o.ppl > 0, 'Inserisci totale e prezzo al litro')) return false;
      if (!need(o.level == null || (o.level >= 0 && o.level <= 100), 'Il livello va da 0 a 100%')) return false;
      const T = db.settings.tankL, L = o.total / o.ppl;
      if (L > T && !confirm(`${F1.format(L)} litri sono più della capienza del serbatoio (${F0.format(T)} L). Salvare comunque?`)) return false;
      if (o.level != null && o.level / 100 * T + L > T + 2 && !confirm(`Con il ${F0.format(o.level)}% già nel serbatoio, ${F1.format(L)} litri non ci stanno (${F0.format(T)} L). Salvare comunque?`)) return false;
      if (!kmOk(o.date, o.km, f.id)) return false;
      upsert(db.fuel, o); save(); toast('Rifornimento salvato');
    }, id && (() => remove(db.fuel, id)));
  const upd = () => {
    const t = num(val('f-tot')), p = num(val('f-ppl')), full = document.getElementById('f-full').checked, T = db.settings.tankL;
    document.getElementById('f-lvlbox').style.display = full ? 'none' : '';
    let s = t > 0 && p > 0 ? `<b>${F2.format(t / p)} litri</b>` : '';
    if (s && full) s += ` · prima ne avevi circa ${F0.format(Math.max(0, T - t / p))} L (${F0.format(Math.max(0, T - t / p) / T * 100)}%)`;
    document.getElementById('f-prev').innerHTML = s;
  };
  ['f-tot', 'f-ppl', 'f-full'].forEach(i => document.getElementById(i).addEventListener(i === 'f-full' ? 'change' : 'input', upd)); upd();
}

function editOdo(id) {
  const r = db.odo.find(x => x.id === id) || { id: uid(), date: today(), km: null };
  openSheet(id ? 'Lettura km' : 'Nuova lettura km', `<div class="group">${fld('Data', 'o-date', r.date, { type: 'date' })}${fld('Contachilometri', 'o-km', r.km, { u: 'km', ph: '0' })}</div>
    <p class="note">Basta una lettura al mese (idealmente il primo giorno), ma puoi aggiungerne quante vuoi.</p>`,
    () => {
      const o = { id: r.id, date: val('o-date'), km: num(val('o-km')) };
      if (!need(o.date && o.km >= 0, 'Inserisci data e km')) return false;
      if (!kmOk(o.date, o.km, r.id)) return false;
      upsert(db.odo, o); save(); toast('Lettura salvata');
    }, id && (() => remove(db.odo, id)));
}

function editMaint(id) {
  const m = db.maint.find(x => x.id === id) || { id: uid(), date: today(), desc: '', cost: null, km: null };
  openSheet(id ? 'Manutenzione' : 'Nuova manutenzione', `<div class="group">${fld('Data', 'm-date', m.date, { type: 'date' })}
    ${fld('Descrizione', 'm-desc', m.desc, { type: 'text', ph: 'Tagliando' })}${fld('Costo', 'm-cost', fmtIn(m.cost, 2), { u: '€', ph: '0,00' })}
    ${fld('Km', 'm-km', m.km, { u: 'km', ph: kmPh() })}${switchFld('È un tagliando', 'm-serv', id ? isService(m) : false)}</div>
    <p class="note">Il prossimo tagliando viene calcolato dall'ultimo intervento segnato come tagliando (ogni ${F0.format(db.settings.serviceKm)} km o ${db.settings.serviceMonths} mesi, modificabile nelle Impostazioni).</p>`,
    () => {
      const o = { id: m.id, date: val('m-date'), desc: val('m-desc').trim(), cost: num(val('m-cost')) || 0, km: num(val('m-km')), service: document.getElementById('m-serv').checked };
      if (!need(o.date && o.desc, 'Inserisci data e descrizione')) return false;
      if (!kmOk(o.date, o.km, m.id)) return false;
      upsert(db.maint, o); save(); toast('Manutenzione salvata');
    }, id && (() => remove(db.maint, id)));
}

function editFee(id) {
  const f = db.fees.find(x => x.id === id) || { id: uid(), date: today(), type: 'Assicurazione', desc: '', cost: null, expiry: '' };
  const types = ['Assicurazione', 'Bollo', 'Revisione', 'Altro'];
  openSheet(id ? f.type : 'Nuovo pagamento', `<div class="group">
    <div class="field"><label for="e-type">Tipo</label><select id="e-type">${types.map(t => `<option ${t === f.type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    ${fld('Pagato il', 'e-date', f.date, { type: 'date' })}${fld('Costo', 'e-cost', fmtIn(f.cost, 2), { u: '€', ph: '0,00' })}
    ${fld('Scadenza', 'e-exp', f.expiry, { type: 'date' })}${fld('Note', 'e-desc', f.desc, { type: 'text', ph: 'Compagnia, polizza…' })}</div>
    <p class="note">Se lasci vuota la scadenza viene impostata a un anno dal pagamento (due anni per la revisione). Le scadenze compaiono nel Riepilogo.</p>`,
    () => {
      const o = { id: f.id, type: val('e-type'), date: val('e-date'), cost: num(val('e-cost')) || 0, expiry: val('e-exp'), desc: val('e-desc').trim() };
      if (!need(o.date, 'Inserisci la data')) return false;
      if (!o.expiry) o.expiry = addYears(o.date, o.type === 'Revisione' ? 2 : 1);
      upsert(db.fees, o); save(); toast('Pagamento salvato');
    }, id && (() => remove(db.fees, id)));
}

function openTariffs() {
  const l = [...db.tariffs].sort((a, b) => a.from < b.from ? 1 : -1);
  openSheet('Tariffa casa', `
    <h2>Nuova tariffa</h2><div class="group">${fld('Valida dal', 't-from', today().slice(0, 8) + '01', { type: 'date' })}${fld('Prezzo', 't-price', '', { u: '€/kWh', ph: '0,30634' })}</div>
    <div class="group" style="margin-top:10px"><button class="row btn" id="t-add">Aggiungi tariffa</button></div>
    <h2>Storico</h2><div class="group">${l.length ? l.map(t => `<div class="row"><div class="main">dal ${dLabel(t.from)}</div><div class="v num">${F5(t.price)} €/kWh</div><button style="color:var(--red);margin-left:8px" data-del="${t.id}">Elimina</button></div>`).join('') : '<div class="empty">Nessuna tariffa</div>'}</div>
    <p class="note">Il prezzo vale da quella data fino alla tariffa successiva: lo inserisci una volta sola e tutte le ricariche a casa da lì in poi lo usano, anche se cambia a metà mese. Usa il prezzo per kWh tutto compreso della bolletta (energia, oneri, IVA).</p>`, null);
  document.getElementById('t-add').onclick = () => {
    const t = { id: uid(), from: val('t-from'), price: num(val('t-price')) };
    if (!need(t.from && t.price > 0, 'Inserisci data e prezzo')) return;
    db.tariffs = db.tariffs.filter(x => x.from !== t.from); db.tariffs.push(t); save(); toast('Tariffa aggiunta'); openTariffs();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Eliminare questa tariffa?')) { remove(db.tariffs, b.dataset.del); openTariffs(); } });
}
const F5 = v => String(v).replace('.', ',');

function openSettings() {
  const s = db.settings;
  openSheet('Impostazioni', `
    <div class="group">${fld('Nome auto', 's-name', s.carName, { type: 'text' })}${fld('Versione', 's-sub', s.carSub, { type: 'text', ph: 'SHS-P · 2026 · Moonlight Silver' })}
      <div class="field"><label for="s-color">Colore disegno</label><input id="s-color" type="color" value="${esc(s.carColor)}" style="flex:none;width:44px;height:30px;padding:0;border-radius:8px"></div>
      ${fld('Immatricolazione', 's-reg', s.regDate, { type: 'date' })}</div>
    <h2>Foto dell'auto</h2><div class="group">
      <button class="row btn" id="s-photo">${getPhoto() ? 'Cambia foto' : 'Scegli una foto'}</button>
      ${getPhoto() ? '<button class="row danger" id="s-nophoto">Rimuovi foto (torna al disegno)</button>' : ''}</div>
    <p class="note">Scegli una foto dalla Galleria o da File: viene mostrata intera (ritagliala prima su Foto) e resta solo su questo iPhone, non viene pubblicata. Per avere solo l'auto senza sfondo: in Foto tieni premuto sull'auto, scegli Condividi → Salva su File, e usa quel file.</p>
    <h2>Ricarica</h2><div class="group">${fld('Capacità batteria', 's-cap', fmtIn(s.capacity, 2), { u: 'kWh' })}${fld('Dispersione ricarica casa', 's-loss', fmtIn(s.loss, 1), { u: '%' })}</div>
    <p class="note">La dispersione si applica solo alle ricariche di casa: rappresenta l'energia persa tra contatore e batteria (caricatore di bordo, cavo, prolunga).</p>
    <h2>Benzina</h2><div class="group">${fld('Capienza serbatoio', 's-tank', s.tankL, { u: 'L' })}${fld('Autonomia a pieno (schermo)', 's-range', s.rangeMax, { u: 'km' })}
      ${fld('Consumo solo benzina', 's-ref', fmtIn(s.petrolRef, 1), { u: 'L/100 km' })}</div>
    <p class="note">"Consumo solo benzina" serve a stimare il risparmio: è quanto consumerebbe l'auto in ibrido senza mai ricaricarla. L'autonomia che l'auto indica a serbatoio pieno corrisponde a ${F1.format(s.tankL / s.rangeMax * 100)} L/100 km (${F0.format(s.tankL)} L ÷ ${F0.format(s.rangeMax)} km); i tuoi dati di marzo-aprile, quasi senza ricariche, danno circa 6,1 L/100 km.</p>
    <h2>Altri calcoli</h2><div class="group">${fld('Consumo in elettrico', 's-ev', fmtIn(s.evCons, 1), { u: 'kWh/100 km' })}
      ${fld('Tagliando ogni', 's-skm', s.serviceKm, { u: 'km' })}${fld('oppure ogni', 's-smo', s.serviceMonths, { u: 'mesi' })}</div>
    <p class="note">Il consumo in elettrico serve solo a stimare la quota di km fatti a batteria (18,3 kWh e circa 90 km di autonomia elettrica ≈ 20 kWh/100 km). Controlla sul libretto di manutenzione l'intervallo dei tagliandi.</p>
    <h2>Backup</h2><div class="group">
      <button class="row btn" id="s-exp">Esporta backup</button>
      <button class="row btn" id="s-imp">Importa backup</button></div>
    <p class="note">I dati restano solo su questo iPhone. Esporta un backup ogni tanto e salvalo su iCloud Drive (File). L'importazione sostituisce tutti i dati attuali.</p>
    <div class="group" style="margin-top:28px"><button class="row danger" id="s-wipe">Cancella tutti i dati</button></div>`,
    () => {
      const cap = num(val('s-cap')), loss = num(val('s-loss')), ref = num(val('s-ref')), skm = num(val('s-skm')), smo = num(val('s-smo'));
      const tank = num(val('s-tank')), range = num(val('s-range')), ev = num(val('s-ev'));
      if (!need(cap > 0 && loss >= 0 && loss < 100 && ref > 0 && skm > 0 && smo > 0 && tank > 0 && range > 0 && ev > 0, 'Valori non validi')) return false;
      db.settings = { carName: val('s-name').trim() || 'Jaecoo 7', carSub: val('s-sub').trim(), carColor: val('s-color'), regDate: val('s-reg'),
        capacity: cap, loss, petrolRef: ref, serviceKm: skm, serviceMonths: smo, tankL: tank, rangeMax: range, evCons: ev }; save(); toast('Impostazioni salvate');
    });
  document.getElementById('s-photo').onclick = () => document.getElementById('photoIn').click();
  const np = document.getElementById('s-nophoto');
  if (np) np.onclick = () => { localStorage.removeItem(PHOTO_KEY); render(); openSettings(); toast('Foto rimossa'); };
  document.getElementById('s-exp').onclick = exportData;
  document.getElementById('s-imp').onclick = () => document.getElementById('fileIn').click();
  document.getElementById('s-wipe').onclick = () => {
    if (confirm('Cancellare tutti i dati da questo dispositivo? L\'operazione non si può annullare: esporta prima un backup.')) { db = structuredClone(DEFAULT); save(); closeSheet(); toast('Dati cancellati'); }
  };
}
async function exportData() {
  const name = 'jaecoo7-backup-' + today() + '.json';
  const file = new File([JSON.stringify(Object.assign({}, db, { photo: getPhoto() || undefined }), null, 1)], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !d.version || !Array.isArray(d.charges)) throw new Error();
    const n = d.charges.length + d.fuel.length + d.odo.length + d.maint.length + d.fees.length;
    if (!confirm(`Importare ${n} voci? I dati attuali verranno sostituiti.`)) return;
    if (d.photo) { try { localStorage.setItem(PHOTO_KEY, d.photo); } catch (e) {} }
    delete d.photo;
    db = Object.assign(structuredClone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, d.settings) });
    save(); closeSheet(); toast('Backup importato');
  } catch (err) { toast('File non valido'); }
});

/* ================= Foto dell'auto ================= */
const PHOTO_KEY = 'jaecoo7-photo';
function getPhoto() { try { return localStorage.getItem(PHOTO_KEY); } catch (e) { return null; } }
document.getElementById('photoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const url = URL.createObjectURL(f), img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = url; });
    // nessun ritaglio: solo ridimensionata a max 1280 px di larghezza.
    // I PNG (es. soggetto isolato con iOS, sfondo trasparente) restano PNG per mantenere la trasparenza.
    const W = Math.min(1280, img.naturalWidth), H = Math.round(W * img.naturalHeight / img.naturalWidth);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    const png = /png|heic|heif/i.test(f.type);
    localStorage.setItem(PHOTO_KEY, png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .88));
    heroCard.done = false; closeSheet(); state.page === 'home' && render(); toast('Foto aggiornata');
  } catch (err) { toast('Impossibile usare questa immagine'); }
});

/* ================= Scorri per eliminare (con Annulla) ================= */
const LISTS = { charges: 'Ricarica', fuel: 'Rifornimento', odo: 'Lettura', maint: 'Manutenzione', fees: 'Pagamento' };
const sw = (k, id, row) => `<div class="sw" data-k="${k}" data-id="${id}"><button class="del" tabindex="-1">Elimina</button>${row}</div>`;
let undo = null;
function swipeDelete(k, id) {
  const i = db[k].findIndex(x => x.id === id); if (i < 0) return;
  undo = { k, item: db[k][i] }; db[k].splice(i, 1); save();
  toast(LISTS[k] + ': eliminato', 'Annulla', () => { if (undo) { db[undo.k].push(undo.item); undo = null; save(); } });
}
(() => {
  let cur = null, x0 = 0, y0 = 0, dx = 0, mode = null, open = null, swallow = false;
  const closeOpen = () => { if (open) { const s = open; s.querySelector('.row').style.transform = ''; setTimeout(() => s.classList.remove('open'), 250); open = null; } };
  document.addEventListener('pointerdown', e => {
    const s = e.target.closest('.sw[data-k]');
    if (e.target.closest('.del')) return;
    if (open && open !== s) { closeOpen(); swallow = true; setTimeout(() => swallow = false, 400); return; }
    if (!s) return;
    cur = s; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
  });
  document.addEventListener('pointermove', e => {
    if (!cur) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!mode) { if (Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)) mode = 'h'; else if (Math.abs(ddy) > 8) { mode = 'v'; cur = null; return; } else return; }
    const base = open === cur ? -88 : 0;
    dx = Math.min(0, Math.max(-120, base + ddx));
    cur.classList.add('drag'); cur.querySelector('.row').style.transform = `translateX(${dx}px)`;
  });
  document.addEventListener('pointerup', () => {
    if (!cur) return;
    cur.classList.remove('drag');
    if (mode === 'h') {
      swallow = true; setTimeout(() => swallow = false, 400);
      if (dx < -44) { cur.querySelector('.row').style.transform = 'translateX(-88px)'; cur.classList.add('open'); open = cur; }
      else { const s = cur; s.querySelector('.row').style.transform = ''; setTimeout(() => s.classList.remove('open'), 250); if (open === cur) open = null; }
    }
    cur = null;
  });
  document.addEventListener('click', e => {
    if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); return; }
    const d = e.target.closest('.sw .del');
    if (d) { const s = d.parentElement; open = null; swipeDelete(s.dataset.k, s.dataset.id); }
  }, true);
})();

/* ================= Navigazione ================= */
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
  state.page = b.dataset.p;
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + state.page));
  window.scrollTo(0, 0); render();
});
bindSeg('seg-charge', v => { state.chargeView = v; render(); });
bindSeg('seg-fuel', v => { state.fuelView = v; render(); });
bindSeg('seg-cost', v => { state.costTab = v; render(); });

let tt;
function toast(msg, actionLabel, action) {
  const t = document.getElementById('toast');
  t.innerHTML = esc(msg) + (actionLabel ? ` <button style="color:var(--blue);font-weight:600;margin-left:10px">${esc(actionLabel)}</button>` : '');
  if (actionLabel) t.querySelector('button').onclick = () => { action(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), actionLabel ? 4500 : 1800);
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
</script>
